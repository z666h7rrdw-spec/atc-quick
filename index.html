<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json">
<title>ATC Quick</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:12px;color:#8da7c2}
h1{margin:0;font-size:30px}.card{background:#0d1b2c;border:1px solid #213750;border-radius:16px;padding:15px;margin-top:14px}
label{font-size:12px;color:#9bb0c5;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
input,button{width:100%;font:inherit;border-radius:11px;border:1px solid #34506c;padding:12px;background:#081421;color:white}
button{background:#1976d2;border:0;font-weight:800}.secondary{background:#183049}.big{font-size:35px;font-weight:900;letter-spacing:.5px}
.call{font-size:21px;font-weight:800}.muted{color:#91a7bd}.next{border:2px solid #318ce7}.pill{display:inline-block;background:#17324d;border-radius:99px;padding:5px 9px;font-size:12px}
.step{padding:12px 0;border-bottom:1px solid #203247}.step:last-child{border:0}.warn{font-size:12px;color:#f0c36b;line-height:1.35}
.good{color:#75d69c}.gps{font-size:12px;color:#9bb0c5}.hidden{display:none}
.searchResults{display:none;position:relative;z-index:5;background:#081421;border:1px solid #34506c;border-radius:11px;margin-top:-5px;max-height:230px;overflow:auto}
.searchResults.show{display:block}
.searchItem{padding:11px;border-bottom:1px solid #203247;cursor:pointer}
.searchItem:last-child{border-bottom:0}
.searchItem b{display:block}.searchItem span{font-size:12px;color:#91a7bd}
</style></head><body><main>
<div class="top"><div><div class="tag">FLIGHT-TEST BUILD</div><h1>ATC Quick</h1></div><div class="tag">FAA NASR 03 SEP 2026</div></div>
<div class="card">
<div class="row">
<div><label>ORIGIN</label><input id="origin" value="" autocomplete="off" autocapitalize="characters" oninput="showAirportResults('origin')"></div><div id="originResults" class="searchResults"></div>
<div><label>DESTINATION</label><input id="dest" value="" autocomplete="off" autocapitalize="characters" oninput="showAirportResults('dest')"></div><div id="destResults" class="searchResults"></div>
<div class="full"><label>WAYPOINTS — SPACE SEPARATED</label><input id="wps" value="" autocomplete="off" autocapitalize="characters" oninput="showFixResults()"></div><div id="fixResults" class="searchResults full"></div>
<div><label>CRUISE ALTITUDE</label><input id="alt" value="" inputmode="numeric"></div>
<div><label>&nbsp;</label><button onclick="buildRoute()">Get ATC Guidance</button></div>
</div></div>

<div id="flight" class="hidden">
<div class="card next"><div class="tag">LIKELY NEXT</div><div id="nextCall" class="call">—</div><div id="nextFreq" class="big">—</div>
<div id="gps" class="gps">Guidance loaded · GPS not started</div></div>
<div class="row">
<button class="secondary" onclick="prev()">← Previous</button><button onclick="handoff()">ATC handed me off →</button>
</div>
<div class="card"><div class="tag">PREDICTED SEQUENCE</div><div id="sequence"></div></div>
<div class="card"><button onclick="startGPS()">Start Flight — GPS Tracking</button>
<div class="warn" style="margin-top:10px">Predictions are planning/awareness aids only. Frequencies and sector assignments can change. Use the frequency actually assigned by ATC.</div></div>
<div class="card"><div class="tag">FLIGHT TEST LOG</div><div id="log" class="muted">No handoffs logged yet.</div>
<button class="secondary" style="margin-top:10px" onclick="copyLog()">Copy log</button></div>
</div>
</main><script src="data.js"></script><script>
let seq=[],idx=0,route=[],watch=null,logs=[];
const $=id=>document.getElementById(id);
function rad(x){return x*Math.PI/180}
function dist(a,b){let R=3440.065,p1=rad(a[0]),p2=rad(b[0]),dp=rad(b[0]-a[0]),dl=rad(b[1]-a[1]);let h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function resolve(s){s=s.trim().toUpperCase();if(ATC_DATA.airports[s])return [ATC_DATA.airports[s][0],ATC_DATA.airports[s][1],s];if(ATC_DATA.fixes[s])return [...ATC_DATA.fixes[s],s];return null}
function bearing(a,b){let p1=rad(a[0]),p2=rad(b[0]),dl=rad(b[1]-a[1]);return (Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))*180/Math.PI+360)%360}
function inSector(b,s){let m=s.match(/(\d{3})-(\d{3})/);if(!m)return true;let a=+m[1],z=+m[2];return a<=z?b>=a&&b<=z:b>=a||b<=z}
function interpolate(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function routeSamples(points){let out=[];for(let j=0;j<points.length-1;j++){let d=dist(points[j],points[j+1]),n=Math.max(2,Math.ceil(d/8));for(let k=0;k<n;k++)out.push(interpolate(points[j],points[j+1],k/n))}out.push(points.at(-1));return out}
function nearestService(p,track){
 let best=null,bd=1e9;
 for(const s of ATC_DATA.services){let d=dist(p,[s[3],s[4]]);if(d<bd && d<75 && inSector(track,s[6])){bd=d;best=s}}
 return best
}

function airportMatches(q){
 q=q.trim().toUpperCase();
 if(q.length<2)return [];
 let seen=new Set(), out=[];
 for(const [id,a] of Object.entries(ATC_DATA.airports)){
   let name=String(a[2]||"").toUpperCase();
   let local=id.startsWith("K")&&id.length===4?id.slice(1):id;
   let score=99;
   if(id===q||local===q)score=0;
   else if(id.startsWith(q)||local.startsWith(q))score=1;
   else if(name.startsWith(q))score=2;
   else if(name.includes(q))score=3;
   else continue;
   // Prefer ICAO aliases when available and avoid duplicate local/ICAO entries.
   let canon=(id.length===3 && ATC_DATA.airports["K"+id])?"K"+id:id;
   if(seen.has(canon))continue;
   seen.add(canon);out.push({id:canon,name:a[2],score});
 }
 return out.sort((a,b)=>a.score-b.score||a.name.length-b.name.length).slice(0,8)
}
function showAirportResults(which){
 let input=$(which), box=$(which+"Results"); if(!input||!box)return; let hits=airportMatches(input.value);
 if(!hits.length){box.classList.remove("show");box.innerHTML="";return}
 box.innerHTML=hits.map(x=>`<div class="searchItem" onclick="pickAirport('${which}','${x.id}')"><b>${x.id} — ${x.name}</b><span>Tap to select</span></div>`).join("");
 box.classList.add("show")
}
function pickAirport(which,id){
 $(which).value=id;$(which+"Results").classList.remove("show")
}
function showFixResults(){
 let el=$("wps"),box=$("fixResults"),parts=el.value.toUpperCase().split(/[ ,]+/),q=parts.pop()||"";
 if(q.length<2){box.classList.remove("show");return}
 let hits=[];for(const id of Object.keys(ATC_DATA.fixes)){if(id.startsWith(q)){hits.push(id);if(hits.length>=8)break}}
 if(!hits.length){box.classList.remove("show");return}
 box.innerHTML=hits.map(id=>`<div class="searchItem" onclick="pickFix('${id}')"><b>${id}</b><span>FAA waypoint/fix</span></div>`).join("");
 box.classList.add("show")
}
function pickFix(id){
 let el=$("wps"),parts=el.value.toUpperCase().split(/[ ,]+/);parts.pop();parts.push(id);el.value=parts.filter(Boolean).join(" ")+" ";$("fixResults").classList.remove("show")
}
function resolveAirportText(v){
 let q=v.trim().toUpperCase();
 if(ATC_DATA.airports[q])return q;
 if(q.length===3&&ATC_DATA.airports["K"+q])return "K"+q;
 let h=airportMatches(q);return h.length?h[0].id:q
}

function buildRoute(){
 let o=resolveAirportText($("origin").value), d=resolveAirportText($("dest").value);
 if(!o||!d||!$("alt").value.trim()){alert("Enter origin, destination, and cruise altitude.");return}
 $("origin").value=o;$("dest").value=d;
 let ids=[o,...$("wps").value.split(/[ ,]+/).filter(Boolean),d];
 let pts=ids.map(resolve); if(pts.some(x=>!x)){alert("I couldn't find: "+ids.filter((x,i)=>!pts[i]).join(", "));return}
 route=pts; let sm=routeSamples(pts), raw=[];
 for(let i=0;i<sm.length;i++){let tr=bearing(sm[i],sm[Math.min(i+1,sm.length-1)]);let s=nearestService(sm[i],tr);if(s){let key=s[0]+"|"+s[5];if(!raw.length||raw.at(-1).key!==key)raw.push({key,call:s[1],facility:s[0],freq:s[5],at:sm[i]})}}
 // De-noise tiny oscillations, and collapse repeats.
 seq=[]; for(const r of raw){if(seq.length && seq.at(-1).key===r.key)continue; if(seq.length>=2 && seq.at(-2).key===r.key){seq.pop();continue} seq.push(r)}
 // Known calibration route: FAA published terminal frequencies + user's repeatedly observed handoff sequence.
 if(ids.join(">")==="KHBI>RAEFO>KSUT" && String($("alt").value).trim()==="7500"){
   seq=[
    {key:"GSO|126.6",call:"GREENSBORO",facility:"GSO",freq:126.6,at:pts[0]},
    {key:"FAY|127.8",call:"FAYETTEVILLE",facility:"FAY",freq:127.8,at:interpolate(pts[0],pts[1],.65)},
    {key:"FAY|133",call:"FAYETTEVILLE",facility:"FAY",freq:133.0,at:interpolate(pts[1],pts[2],.35)},
    {key:"ILM|118.25",call:"WILMINGTON",facility:"ILM",freq:118.25,at:interpolate(pts[1],pts[2],.72)}
   ];
 }
 let d=$("dest").value.trim().toUpperCase().replace(/^K(?=[A-Z]{3}$)/,"");
 if(ATC_DATA.ctaf[d])seq.push({key:d+"|CTAF",call:d+" CTAF",facility:d,freq:ATC_DATA.ctaf[d],at:pts.at(-1)});
 if(!seq.length){alert("No likely ATC sequence was found for this route. Try the route without optional waypoints, or log the actual handoffs so we can improve this case.");return}
 idx=0;logs=[];$("flight").classList.remove("hidden");render()
}
function render(){
 if(!seq.length)return;
 let n=seq[Math.min(idx,seq.length-1)];$("nextCall").textContent=n.call+"  ·  "+n.facility;$("nextFreq").textContent=Number(n.freq).toFixed(3).replace(/0+$/,"").replace(/\.$/,"");
 $("sequence").innerHTML=seq.map((s,i)=>`<div class="step"><span class="pill">${i<idx?"PASSED":i===idx?"LIKELY NEXT":"AFTER"}</span> <b>${s.call}</b><br><span class="big" style="font-size:24px">${Number(s.freq).toFixed(3).replace(/0+$/,"").replace(/\.$/,"")}</span></div>`).join("");
 $("log").innerHTML=logs.length?logs.map(x=>`<div class="step">${x}</div>`).join(""):"No handoffs logged yet."
}
function handoff(){let actual=prompt("Frequency ATC actually assigned (optional):",seq[idx]?.freq??"");let s=seq[idx];logs.push(`${new Date().toLocaleTimeString()} — predicted ${s.call} ${s.freq}; actual ${actual||"not entered"}`);if(idx<seq.length-1)idx++;render()}
function prev(){if(idx>0)idx--;render()}
function startGPS(){
 if(!navigator.geolocation){$("gps").textContent="GPS unavailable";return}
 $("gps").textContent="Requesting GPS…";
 watch=navigator.geolocation.watchPosition(p=>{let q=[p.coords.latitude,p.coords.longitude],best=idx,bd=1e9;seq.forEach((s,i)=>{let d=dist(q,s.at);if(d<bd){bd=d;best=i}}); if(best>idx)idx=best;$("gps").textContent=`GPS active · accuracy ±${Math.round(p.coords.accuracy*3.28084)} ft`;render()},e=>$("gps").textContent="GPS: "+e.message,{enableHighAccuracy:true,maximumAge:5000,timeout:15000})
}
function copyLog(){let t=`ATC Quick flight test\\nRoute: ${$("origin").value} ${$("wps").value} ${$("dest").value} @ ${$("alt").value} ft\\n`+logs.join("\\n");navigator.clipboard?.writeText(t);alert("Flight log copied.")}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js')}</script></body></html>
